# REJECT_DEADLINE_INFEASIBLE: the job is well-formed and conflict-free, but the
# contracts' worst-case timing cannot fit in the 2000 ms deadline.
plan_id: demo.deadline_reject
description: Same job as 01, but the warning lamp is asked to pulse 12 times.
deadline_ms: 2000
permissions: [READ_SENSOR, ACTUATE, POWER_CONTROL, DIAG]
steps:
  - id: volt
    action: sensor.read
    args: { sensor: pack_voltage }
  - id: cool
    action: sensor.read
    args: { sensor: coolant_proxy, samples: 4 }
  - id: warn
    action: actuator.pulse
    args: { channel: warn_lamp, count: 12, on_ms: 100, off_ms: 100 }
    needs: [volt, cool]
    when: { ref: cool.value, op: ">", value: 30 }
  - id: rest
    action: power.idle
    args: { duration_ms: 300, mode: light }
    needs: [volt, cool]
    when: { ref: cool.value, op: "<=", value: 30 }
  - id: report
    action: diag.report
    args: { scope: summary }
    needs: [warn, rest]
