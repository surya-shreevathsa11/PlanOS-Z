CONFIG_PLANOSZ=y
CONFIG_PLANOSZ_SHELL=y

CONFIG_SHELL=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
# vsnprintf in the NDJSON tracer
CONFIG_CBPRINTF_COMPLETE=y

# 1 ms kernel tick: WCET budgets in the contracts assume sleeps are accurate to ~1 ms.
# (With the 10 ms default tick, k_msleep(5) takes 20 ms and real jobs blow their WCET.)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Interactive by default: use `planosz plans|admit|run` on the shell.
# For the non-interactive ACCEPT/REJECT/REJECT demo use: -DEXTRA_CONF_FILE=demo.conf
CONFIG_APP_AUTODEMO=n
