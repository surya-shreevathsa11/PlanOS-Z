# Same as native_sim.conf (Zephyr 4.x loads <board>_<qualifiers>.conf for native_sim/native/64).
# Simulated time runs as fast as the host allows: deterministic and CI friendly.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
# Parallel DAG executor on native_sim: 2 worker threads
CONFIG_PLANOSZ_EXECUTOR_PARALLEL=y
CONFIG_PLANOSZ_EXEC_WORKERS=2
